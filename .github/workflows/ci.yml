name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The documentation stance is CI-checked for presence, like DRT's
      # GUARANTEES.md (SPEC.md §11).
      - run: test -s THREAT-NOTES.md
      # Refusal messages are what people read when dollup says no; a lost
      # line-continuation turns one into a wall of spaces.
      - run: python3 ci/check-strings.py
      # The site contract: builds offline, and check.py runs inside it, so a
      # template that lost a load-bearing detail fails here rather than
      # deploying a page that quietly stopped working.
      - run: ./site/build.sh --out /tmp/site-out
