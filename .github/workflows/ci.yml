name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The documentation stance is CI-checked for presence, like DRT's
      # GUARANTEES.md (SPEC.md §11).
      - run: test -s THREAT-NOTES.md
      # Refusal messages are what people read when dollup says no; a lost
      # line-continuation turns one into a wall of spaces.
      - run: python3 ci/check-strings.py
      # The landing page quietly stops working rather than looking broken
      # when it loses the pubkey token or the live index fetch.
      - run: python3 web/check.py
      # The standard repo must always be publishable: index re-hashes every
      # package independently, so a hand-edited file or a stale seal fails
      # here rather than at the mirror.
      - run: cargo run -q -p dollup -- repo index std-repo
      - run: git diff --exit-code std-repo/index.json
