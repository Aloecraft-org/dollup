name: Release

# Builds and (optionally) publishes a dollup release for one specific commit.
# The halves every Aloecraft release shares -- which tag, whether this run
# publishes, the changelog gate, BUILDINFO.txt, SHA256SUMS.txt, the notes and
# the release itself -- are technoproj's reusable workflows, pinned below.
# This file keeps only what is dollup's: the tests, the platform matrix and
# the smoke test. A manual run is a full rehearsal by default -- tests, every
# platform, artifacts left on the run -- and publishes only when
# publish=true.
#
# A `-dev.N` tag is a cheap build of the newest entry from one commit: one
# platform, always a prerelease, no entry of its own. nightly.yml dispatches
# those; `dev_builds` is not declared, so a merge to main cuts nothing.
#
# The smoke test is the point of the whole file. Every artifact must not just
# link but RESOLVE: it seals and indexes a one-package repo it writes itself,
# pulls the package from it over file:// into a root, and verifies the result
# against the lock. A binary that cannot do that is not a dollup, however
# cleanly it compiled.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to release (blank = the selected branch)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Tag name, e.g. v0.1.0 (required when publishing)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish to the Releases page. Leave off for a rehearsal.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    uses: Aloecraft-org/technoproj/.github/workflows/release-preflight.yml@v0.3.0
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish || false }}

  # The suffix decides the rigor (doc/ALIGNMENT.md §7): a dev build is one
  # platform, the one that can run its own smoke test here; everything else
  # builds every platform. Decided here so the build job's matrix is a fact
  # of the run rather than a checkbox.
  matrix:
    name: Matrix
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          DEV: ${{ needs.preflight.outputs.dev }}
        run: |
          set -eu
          full='{"include":[
            {"name":"linux_x86_64_musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","setup":"sudo apt-get update && sudo apt-get install -y musl-tools"},
            {"name":"darwin_arm64","os":"macos-latest","target":"aarch64-apple-darwin","setup":"true"},
            {"name":"darwin_x86_64","os":"macos-15-intel","target":"x86_64-apple-darwin","setup":"true"}]}'
          dev='{"include":[
            {"name":"linux_x86_64_musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","setup":"sudo apt-get update && sudo apt-get install -y musl-tools"}]}'
          if [ "$DEV" = true ]; then m="$dev"; else m="$full"; fi
          # One line for GITHUB_OUTPUT, compacted as JSON rather than by
          # stripping whitespace, which would eat the spaces inside `setup`.
          echo "matrix=$(echo "$m" | jq -c .)" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The same gates ci.yml keeps, because a release must not be a way
      # around them.
      - run: test -s THREAT-NOTES.md
      - run: python3 ci/check-strings.py
      - run: ./site/build.sh --check
      # install.sh ships as a release asset so the curl|sh front door has a
      # URL that exists with no server-side work. The shared publish leg
      # takes every `dollup-*` artifact, so it travels as one.
      - uses: actions/upload-artifact@v4
        with:
          name: dollup-install-sh
          path: install.sh
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build (${{ matrix.name }})
    needs: [preflight, matrix, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Static musl: drops onto any Linux box with nothing installed, which
      # is the whole distribution story. `ring` (under rustls) compiles C,
      # so musl-tools is required even though dollup itself is pure Rust.
      # An Intel macOS runner rather than a cross-build, so the smoke test
      # below can actually RUN the artifact: every binary in a release has
      # been executed before it ships. Names are doc/ALIGNMENT.md §4's:
      # <project>_<os>_<arch>[_<libc>], the profile last when there is one.
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Setup
        run: ${{ matrix.setup }}
      - name: Build
        run: |
          set -eu
          cargo build --profile release-small -p dollup --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/dollup dollup_${{ matrix.name }}
      - name: Smoke test — it must resolve, not merely run
        run: |
          set -eu
          BIN="$PWD/dollup_${{ matrix.name }}"
          "$BIN" --version
          # A publisher round trip over a repo written here...
          work=$(mktemp -d)
          repo="$work/repo"
          mkdir -p "$repo/packages/smoke/0.1.0/guest"
          printf 'local M = {}\nreturn M\n' > "$repo/packages/smoke/0.1.0/guest/smoke.dlua"
          cat > "$repo/packages/smoke/0.1.0/manifest.json" <<'JSON'
          { "name": "smoke", "version": "0.1.0", "license": "Apache-2.0",
            "guest": { "modules": { "smoke": "guest/smoke.dlua" }, "source_only": true } }
          JSON
          "$BIN" repo seal "$repo/packages/smoke/0.1.0"
          "$BIN" repo index "$repo"
          # ...and a consumer one against it, in a scratch root whose only
          # source is that repo (the scaffolded standard source is a network
          # source, and a smoke test talks to no network).
          root="$work/root"
          "$BIN" --root "$root" init smoke
          "$BIN" --root "$root" source rm https://dollup.aloecraft.org/std-repo/
          "$BIN" --root "$root" source rm zip+https://github.com/Aloecraft-org/drt-std-lib/archive/refs/heads/main.zip
          "$BIN" --root "$root" source add "file://$repo"
          "$BIN" --root "$root" pull smoke
          "$BIN" --root "$root" verify
          test -f "$root/.drt_root/init/smoke.dlua"
          echo "smoke: resolved and verified a package from a file:// repo"
      - uses: actions/upload-artifact@v4
        with:
          name: dollup-${{ matrix.name }}
          path: dollup_*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, test, build]
    if: needs.preflight.outputs.publish == 'true'
    permissions:
      contents: write        # the caller grants it; a called workflow cannot
    uses: Aloecraft-org/technoproj/.github/workflows/release-publish.yml@v0.3.0
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      sha: ${{ needs.preflight.outputs.sha }}
      branch: ${{ needs.preflight.outputs.branch }}
      version: ${{ needs.preflight.outputs.version }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
      name: dollup ${{ needs.preflight.outputs.tag }}
      artifacts: dollup-*
