name: Release

# Builds and (optionally) publishes a dollup release for one specific commit.
# The shape is diluvium-drt's release.yml, kept deliberately: a tag push
# publishes; a manual run is a full rehearsal by default — tests, every
# platform, artifacts left on the run — and touches the Releases page only
# when publish=true.
#
# The changelog is the gate and the source (doc/ALIGNMENT.md): CHANGELOG.yaml
# must describe the tag, `prerelease` derives from its `stable`, the release
# body is its entry rendered, and BUILDINFO.txt carries its compatibility
# facts. A `-dev.N` tag is a cheap build of the newest entry from one
# commit: one platform, always a prerelease, no entry of its own.
#
# The smoke test is the point of the whole file. Every artifact must not just
# link but RESOLVE: it seals and indexes a one-package repo it writes itself,
# pulls the package from it over file:// into a root, and verifies the result
# against the lock. A binary that cannot do that is not a dollup, however
# cleanly it compiled.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to release (blank = the selected branch)'
        type: string
        required: false
        default: ''
      tag:
        description: 'Tag name, e.g. v0.1.0 (required when publishing)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish to the Releases page. Leave off for a rehearsal.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      branch: ${{ steps.check.outputs.branch }}
      # Derived from the changelog's `stable`, which is the truth; GitHub's
      # flag is downstream of it. `version` is the entry's PEP 440 spelling
      # and `dev` says whether this is a dev build, which decides the rigor.
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      version: ${{ steps.changelog.outputs.version }}
      dev: ${{ steps.changelog.outputs.dev }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ inputs.ref }}
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH=true
          else
            TAG="$IN_TAG"
            PUBLISH="${IN_PUBLISH:-false}"
            if [ "$PUBLISH" = true ] && [ -z "$TAG" ]; then
              echo "::error::publish=true requires a tag name."
              exit 1
            fi
            if [ -n "$TAG" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag '$TAG' already exists."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The branch, for BUILDINFO (doc/ALIGNMENT.md §5): a tag push
          # carries none, so derive it and record what was found rather
          # than a guess; a dispatch names its ref, which is authoritative
          # when it is a branch.
          SHA=$(git rev-parse HEAD)
          BRANCH=""
          if [ "$EVENT" != push ] && [ -n "${IN_REF:-}" ] \
             && git show-ref -q --verify "refs/remotes/origin/$IN_REF"; then
            BRANCH="$IN_REF"
          else
            BRANCH=$(git branch -r --contains "$SHA" --format='%(refname:lstrip=3)' \
                     | grep -vx HEAD | head -1)
          fi
          echo "branch=${BRANCH:-(detached)}" >> "$GITHUB_OUTPUT"
      # The changelog is a release gate, not a formality: CHANGELOG.yaml is
      # what the release body and the mirror are generated from, so a tag
      # with no entry -- or an entry still marked unreleased -- would
      # publish an empty description and leave the mirror unable to
      # describe what it is carrying. `--publish` makes the check strict
      # only when something is actually going to the Releases page, so a
      # rehearsal still runs against an `unreleased` entry. A rehearsal
      # with no tag at all is checked against the newest entry.
      - name: The changelog describes this tag
        id: changelog
        run: |
          set -eu
          pip install --quiet pyyaml
          ./script/changelog.py validate
          ./script/changelog.py check
          ./script/changelog.py consistency
          TAG='${{ steps.check.outputs.tag }}'
          if [ -z "$TAG" ]; then
            TAG=$(python3 -c "import yaml; print(yaml.safe_load(open('CHANGELOG.yaml'))['releases'][0]['tag'])")
          fi
          ./script/changelog.py release-check --tag "$TAG" \
            ${{ steps.check.outputs.publish == 'true' && '--publish' || '' }} \
            >> "$GITHUB_OUTPUT"
      # The suffix decides the rigor (doc/ALIGNMENT.md §7): a dev build is
      # one platform, the one that can run its own smoke test here;
      # everything else builds every platform. Decided here so the build
      # job's matrix is a fact of the run rather than a checkbox.
      - id: matrix
        run: |
          set -eu
          full='{"include":[
            {"name":"linux_x86_64_musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","setup":"sudo apt-get update && sudo apt-get install -y musl-tools"},
            {"name":"darwin_arm64","os":"macos-latest","target":"aarch64-apple-darwin","setup":"true"},
            {"name":"darwin_x86_64","os":"macos-15-intel","target":"x86_64-apple-darwin","setup":"true"}]}'
          dev='{"include":[
            {"name":"linux_x86_64_musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","setup":"sudo apt-get update && sudo apt-get install -y musl-tools"}]}'
          if [ "${{ steps.changelog.outputs.dev }}" = true ]; then m="$dev"; else m="$full"; fi
          # One line for GITHUB_OUTPUT, compacted as JSON rather than by
          # stripping whitespace, which would eat the spaces inside `setup`.
          echo "matrix=$(echo "$m" | jq -c .)" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The same gates ci.yml keeps, because a release must not be a way
      # around them.
      - run: test -s THREAT-NOTES.md
      - run: python3 ci/check-strings.py
      - run: ./site/build.sh --check

  build:
    name: Build (${{ matrix.name }})
    needs: [preflight, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Static musl: drops onto any Linux box with nothing installed, which
      # is the whole distribution story. `ring` (under rustls) compiles C,
      # so musl-tools is required even though dollup itself is pure Rust.
      # An Intel macOS runner rather than a cross-build, so the smoke test
      # below can actually RUN the artifact: every binary in a release has
      # been executed before it ships. Names are doc/ALIGNMENT.md §4's:
      # <project>_<os>_<arch>[_<libc>], the profile last when there is one.
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Setup
        run: ${{ matrix.setup }}
      - name: Build
        run: |
          set -eu
          cargo build --profile release-small -p dollup --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release-small/dollup dollup_${{ matrix.name }}
      - name: Smoke test — it must resolve, not merely run
        run: |
          set -eu
          BIN="$PWD/dollup_${{ matrix.name }}"
          "$BIN" --version
          # A publisher round trip over a repo written here...
          work=$(mktemp -d)
          repo="$work/repo"
          mkdir -p "$repo/packages/smoke/0.1.0/guest"
          printf 'local M = {}\nreturn M\n' > "$repo/packages/smoke/0.1.0/guest/smoke.dlua"
          cat > "$repo/packages/smoke/0.1.0/manifest.json" <<'JSON'
          { "name": "smoke", "version": "0.1.0", "license": "Apache-2.0",
            "guest": { "modules": { "smoke": "guest/smoke.dlua" }, "source_only": true } }
          JSON
          "$BIN" repo seal "$repo/packages/smoke/0.1.0"
          "$BIN" repo index "$repo"
          # ...and a consumer one against it, in a scratch root whose only
          # source is that repo (the scaffolded standard source is a network
          # source, and a smoke test talks to no network).
          root="$work/root"
          "$BIN" --root "$root" init smoke
          "$BIN" --root "$root" source rm https://dollup.aloecraft.org/std-repo/
          "$BIN" --root "$root" source add "file://$repo"
          "$BIN" --root "$root" pull smoke
          "$BIN" --root "$root" verify
          test -f "$root/.drt_root/init/smoke.dlua"
          echo "smoke: resolved and verified a package from a file:// repo"
      - uses: actions/upload-artifact@v4
        with:
          name: dollup-${{ matrix.name }}
          path: dollup_*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [preflight, test, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dollup-*
          path: release_dist
          merge-multiple: true
      - name: BUILDINFO and checksums
        run: |
          set -eu
          pip install --quiet pyyaml
          # install.sh ships as a release asset so the curl|sh front door has
          # a URL that exists with no server-side work.
          cp install.sh release_dist/install.sh
          # A rename publishes both names for one release (doc/ALIGNMENT.md
          # §4): the Linux binary is also published under the name every
          # release up to v0.0.1 used, so anything fetching it by that name
          # keeps working through this release. Drop this line in the next.
          if [ -f release_dist/dollup_linux_x86_64_musl ]; then
            cp release_dist/dollup_linux_x86_64_musl release_dist/dollup_linux_static_x86_64
          fi
          # The five lines every Aloecraft release carries (doc/ALIGNMENT.md
          # §5), then this project's own compatibility facts -- the same
          # ones the changelog entry states, printed by the same tool, so
          # the two cannot disagree.
          {
            echo "tag: ${{ needs.preflight.outputs.tag }}"
            echo "version: ${{ needs.preflight.outputs.version }}"
            echo "commit: ${{ needs.preflight.outputs.sha }}"
            echo "branch: ${{ needs.preflight.outputs.branch }}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ./script/changelog.py buildinfo --tag '${{ needs.preflight.outputs.tag }}'
          } > release_dist/BUILDINFO.txt
          # Every other asset, BUILDINFO included; generated last so the
          # glob does not include it (ALIGNMENT §6).
          cd release_dist && sha256sum * > SHA256SUMS.txt
          cat BUILDINFO.txt SHA256SUMS.txt
      # The release body is the changelog's, not GitHub's autogenerated
      # commit list: a body derived from commit subjects says what changed
      # in the repository rather than what changed for the person
      # installing it.
      - name: Release notes, from the changelog
        run: |
          set -eu
          ./script/changelog.py render md --tag '${{ needs.preflight.outputs.tag }}' > release_notes.md
          cat release_notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.sha }}
          name: dollup ${{ needs.preflight.outputs.tag }}
          files: release_dist/*
          body_path: release_notes.md
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
