# The dollup workspace: a format crate (pure types, hashing, signing — the
# things a static mirror generator or DRT itself could consume without taking
# the binary) and the binary crate (store, fetch, verbs).
[workspace]
resolver = "2"
members = ["crates/dollup-format", "crates/dollup"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Aloecraft-org/dollup"

[workspace.dependencies]
# A path dependency needs no version -- this workspace is not published to
# crates.io -- and a version here would be a second place to bump.
dollup-format = { path = "crates/dollup-format" }
# The shared formats and the signing helper (consent.md; the seven-point
# list). Pinned to a rev, never a branch: nothing mutable is ever a pin.
drt-config = { git = "https://github.com/Aloecraft-org/diluvium-drt", rev = "cf6e22b0c3e739cc007878765174d99798ce399b" } # v0.6.1-rc.2
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Signing is drt-config's (`drt_config::sign`, ed25519-dalek 3); the one
# thing dollup-format still needs of its own is entropy for `repo keygen`,
# because the shared signer takes its 32 random bytes as an argument rather
# than choosing an RNG for its callers.
# `std` so its error is a std Error and reads like every other refusal.
getrandom = { version = "0.2", features = ["std"] }
semver = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Pinned to what ureq 2.12 itself builds against, because dollup hands it a
# ClientConfig and the types have to be the same ones (see crates/dollup/src/http.rs).
rustls = { version = "0.23.19", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
tempfile = "3"

# The artifact profile. dollup travels — onto a build host, into a container,
# through an air gap on a USB stick — so the released binary is optimized for
# size rather than for the last few percent of speed. Nothing dollup does is
# CPU-bound; it hashes a few megabytes and writes files.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
