# dollup.aloecraft.org — the landing page and the standard repo.
#
# A dollup repo is a directory. There is no application here, no database,
# and nothing dynamic: nginx serves files, and every integrity claim is made
# by the client against the signed index. Self-hosting a mirror is this file
# plus a copy of the tree.

server {
    listen 443 ssl;
    http2 on;
    server_name dollup.aloecraft.org;

    ssl_certificate     /etc/letsencrypt/live/dollup.aloecraft.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dollup.aloecraft.org/privkey.pem;

    root /var/www/dollup;
    autoindex off;

    # The index and its signature change on every publish. A cached one is a
    # rollback the client cannot detect — dollup verifies authenticity, not
    # freshness (THREAT-NOTES.md) — so never let an intermediary hold them.
    location = /std-repo/index.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type application/json;
    }
    location = /std-repo/index.json.sig {
        add_header Cache-Control "no-cache, must-revalidate" always;
        default_type text/plain;
    }

    # Blobs are content-addressed: the name IS the hash, so the bytes under
    # a URL can never change. Cache them forever, everywhere.
    location /std-repo/blobs/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        default_type application/octet-stream;
    }

    # The package tree, for clients that read paths rather than blobs.
    location /std-repo/ {
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name dollup.aloecraft.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
