# dollup.aloecraft.org — cache policy for the standard repo.
#
# A drop-in, not a server block: the vhost is generated from the domain
# manifest and includes site-extra/dollup.aloecraft.org/*.conf, which is
# where this belongs. It carries no `root` and no `listen` on purpose.
#
# A dollup repo is a directory, so every integrity claim is the client's,
# made against the signed index. nginx's only job is to not get in the way
# of that -- and the two rules below are the whole of it.

# The index and its signature change on every publish. A cached one is a
# rollback the client cannot detect -- dollup verifies authenticity, not
# freshness (THREAT-NOTES.md) -- so never let an intermediary hold them.
location = /std-repo/index.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    default_type application/json;
}
location = /std-repo/index.json.sig {
    add_header Cache-Control "no-cache, must-revalidate" always;
    default_type text/plain;
}

# Blobs are content-addressed: the name IS the hash, so the bytes under a
# URL can never change. Cache them forever, everywhere.
location /std-repo/blobs/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    default_type application/octet-stream;
}

# The package tree, for clients that read paths rather than blobs.
location /std-repo/ {
    add_header Cache-Control "public, max-age=300" always;
}

# The landing page is one file that changes on every publish.
location = / {
    add_header Cache-Control "no-cache" always;
}
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# The installer has a .sh extension but is meant to be read before it is
# piped to a shell; serve it as text so a browser shows it. `default_type`
# only applies to an extension mime.types does NOT map, and .sh is mapped
# (application/x-sh), so the map is emptied for this one location first --
# otherwise the directive is silently ignored and a browser downloads it.
location = /install.sh {
    types { }
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
}
